<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVRA ADMIN</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/icons/favicon.ico?v=3" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-design-system.css">
<link rel="stylesheet" href="admin.css">
<script>
  /* Thème appliqué avant le rendu pour éviter tout flash */
  (function () {
    var saved = localStorage.getItem('novra-admin-theme');
    var sys = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = saved || sys;
  })();
</script>
</head>
<body>

<!-- ============================= CONNEXION ============================= -->
<div class="login" id="login-view">
  <form class="login-box" id="login-form" novalidate>
    <div class="brand">
      <img src="../assets/web/logo/novra-wordmark-hero.png" alt="NOVRA">
      <span>ADMIN</span>
    </div>

    <div class="field">
      <label for="login-email">Adresse e-mail</label>
      <input class="input" type="email" id="login-email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="login-password">Mot de passe</label>
      <input class="input" type="password" id="login-password" autocomplete="current-password" required>
    </div>

    <button class="btn btn-primary btn-block" type="submit" id="login-submit">Se connecter</button>
    <div class="login-links"><button class="link-btn" type="button" id="forgot-password">Mot de passe oublié</button></div>
    <p class="login-msg" id="login-msg" role="status" aria-live="polite"></p>
  </form>
</div>

<!-- ================================ APP =============================== -->
<div class="admin-app" id="app-view" hidden>

  <div class="sb-overlay" id="sb-overlay" hidden></div>

  <aside class="admin-sidebar" id="sidebar">
    <div class="sb-brand" style="display:flex;align-items:flex-start;justify-content:space-between">
      <div>
        <img src="../assets/web/logo/novra-wordmark-hero.png" alt="NOVRA">
        <span>ADMIN</span>
      </div>
      <button class="btn btn-icon sb-close" type="button" id="sb-close" aria-label="Fermer le menu">
        <svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <nav class="sb-nav" id="sb-nav" aria-label="Navigation principale"></nav>
    <div class="sb-foot">
      <div class="sb-user">
        <span class="avatar" id="me-avatar">—</span>
        <span class="grow">
          <strong id="me-name">—</strong>
          <small id="me-role">—</small>
        </span>
        <i class="sb-dot" title="Connecté"></i>
      </div>
      <button class="btn btn-block" type="button" id="logout">
        <svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Déconnexion
      </button>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-header">
      <button class="burger" type="button" id="menu-toggle" aria-label="Ouvrir le menu" aria-expanded="false">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="titles">
        <h1 id="page-title">Dashboard</h1>
        <p id="page-sub">Vue d'ensemble de votre activité e-commerce</p>
      </div>
      <div class="header-actions" id="header-actions"></div>
    </header>

    <div class="admin-content" id="admin-content"></div>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/products.js"></script>
<script src="admin-ui.js"></script>
<script src="admin-pages.js"></script>
<script src="admin.js"></script>
</body>
</html>
