<body data-page="newsletter" class="has-solid-header">
<a class="skip-link" href="#main">Aller au contenu</a>
<div id="header-root"></div>

<main id="main">
  <!-- Page dédiée à la newsletter : reprend le formulaire qui vivait avant
       sur l'accueil (même id="newsletter-form", même logique JS
       initNewsletter() dans js/main.js, inchangée). Fond sombre conservé
       car .newsletter-form est stylé en blanc sur fond noir. -->
  <section class="section section-dark">
    <div class="container container-narrow">
      <p class="breadcrumb" style="color:var(--white-45)">
        <a href="index.html" style="color:inherit">Accueil</a><span>/</span>Newsletter
      </p>
      <h1 class="display-2" style="margin-top:14px">Restez informé</h1>
      <p class="lead" style="margin:18px 0 34px">Inscrivez-vous et recevez nos nouveautés et conseils performance, directement par e-mail.</p>

      <form id="newsletter-form" class="newsletter-form" novalidate>
        <label class="sr-only" for="newsletter-email">Adresse e-mail</label>
        <input type="email" id="newsletter-email" name="email" placeholder="Votre e-mail" autocomplete="email" required>
        <button type="submit" aria-label="S'inscrire à la newsletter">
          <svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
        </button>
      </form>
      <p class="form-feedback" role="status" aria-live="polite"></p>
    </div>
  </section>
</main>
